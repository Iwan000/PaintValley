[SystemSettings]
; Deep focus, as in the film's plates: the raindrops are sharp right up to the lens (particle DOF is only a
; touch, RainMagicController.DofScale) and the engine's DOF is off. It also blurred the after-DOF raindrops
; in some frames, and cost 3-6 ms a frame on an M2 Pro.
r.DepthOfFieldQuality=0
; Nothing in the scene is lit translucency (the drops are unlit): skip the translucency lighting volume.
r.TranslucencyLightingVolume=0
; TSR keeps its history at the output resolution, not twice it (the Epic anti-aliasing level's 200 %). Film scene in
; PIE on an M2 Pro (the performance from 6 s to 46 s, fresh editor each): 33.2 -> 37.5 fps; still drops and fast
; streaks look the same. TAA would give 49.6 fps but softens and smears the moving streaks; FXAA at the same render
; resolution blurs (it can't upsample). Movie renders put 200 back (Scripts/render_mrq.py).
r.TSR.History.ScreenPercentage=100
; The editor-only sky atmosphere notification pass (1.4 ms in a ProfileGPU of the film scene; the level has no sky
; atmosphere): 37.5 -> 38.4 fps with the line above. No effect in a game build.
r.SkyAtmosphere.EditorNotifications=0
